# Libvirt QEMU configuration for input device access
# Add this to /etc/libvirt/qemu.conf

# Allow access to input devices for evdev passthrough
cgroup_device_acl = [
    "/dev/null", "/dev/full", "/dev/zero",
    "/dev/random", "/dev/urandom",
    "/dev/ptmx", "/dev/kvm", "/dev/kqemu",
    "/dev/rtc", "/dev/hpet",
    "/dev/input/by-id/usb-Logitech_Gaming_Mouse_G502_SERIAL-event-mouse",
    "/dev/input/by-id/usb-Keychron_Keychron_K2_Max-event-kbd"
]

# Optional: Run as specific user/group for better permissions
# Uncomment if needed:
# user = "alex"
# group = "users"
